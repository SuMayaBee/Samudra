# Short two-degree OM4 slice for screening stochastic-depth candidates within
# one Kaggle T4 session. The full public validation year remains unchanged.
sources:
  - type: om4
    prognostic_vars_key: thermo_dynamic_all
    boundary_vars_key: tau_hfds
    train_time:
      start: "2011-01-03"
      end: "2013-10-05"
    val_time:
      start: "2013-10-05"
      end: "2014-10-05"
    inference_times:
      - start: "2014-10-10"
        end: "2015-10-05"
    data_location:
      type: s3
      endpoint_url: "https://nyu1.osn.mghpcc.org"
      anon: true
      bucket: m2lines-pubs
      path: Samudra/v2026-09/om4_twodeg/OM4.zarr
    data_means_location:
      type: s3
      endpoint_url: "https://nyu1.osn.mghpcc.org"
      anon: true
      bucket: m2lines-pubs
      path: Samudra/v2026-09/om4_twodeg/OM4_means.zarr
    data_stds_location:
      type: s3
      endpoint_url: "https://nyu1.osn.mghpcc.org"
      anon: true
      bucket: m2lines-pubs
      path: Samudra/v2026-09/om4_twodeg/OM4_stds.zarr
concurrent_compute: true
loading:
  type: cpu

